# Push-gate pins (bennett/tools/gate_README.md). Siblings resolve only to these commits.
schema = 1
repo = "bennett-estimate"
tool_sha = "822aaeffab369114e1a719a7b887a0192b22d386"
timeout_s = 7200

# Paths no check reads; changing only these reuses a PASS receipt (bennett/tools/gate_README.md).
[receipt]
non_product = [".beads/", "worklog/"]

[env]
CARGO_TARGET_DIR = "{root}/.tmp/gate-target"
BENNETT_VM_BIN = "{sibling:bennett-vm}/target/debug/bennett-vm"

[[check]]
name = "quality baseline"
argv = ["python3", "-I", "-B", "scripts/quality_ratchet.py"]

[[check]]
name = "scripts/check"
argv = ["scripts/check"]

[siblings."bennett-isa-spec"]
sha = "fd626d37aba1f719c3b7b2059be46cbfaf462886"
note = "Published K86/K91 additive target/token contracts; base implementation remains partial"
[siblings."bennett-isa-spec".files]
"spec/Bennett-ISA-Spec-0.9.md" = "bbd887c7841f4eed40f7b3518270a8f2cf781204c14ac4cc3eabca5c5b4b8c3b"

[siblings."bennett-targets"]
sha = "d2b0813b262de8cbe6f1d5a4134c6a748d41b1bc"
note = "targets origin/main"

[siblings."bennett-conformance"]
sha = "b077ae2a22e73b2321dcfe2fccede885f47b8d89"
note = "conformance origin/main (ladder/rung-3 fixtures)"

[siblings."bennett-vm"]
sha = "d9cb68433c08f4db8f7d8c90f121a8adae51759b"
note = "vm origin/main; debug binary as differential oracle"

[[siblings."bennett-vm".build]]
name = "vm (debug)"
argv = ["cargo", "build", "--offline"]
outputs = ["target/debug/bennett-vm"]
env = { CARGO_BUILD_JOBS = "3" }
